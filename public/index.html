<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roulette</title>
  <meta name="description" content="A customizable web roulette wheel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="langBtn" class="ghost lang-btn" aria-label="Language"></button>
  <div class="rotate-msg" data-i18n="rotate"></div>
  <main class="app">
    <h1 class="title" data-i18n="title">Roulette</h1>
    <div class="layout single">
      <section class="stage" aria-label="Roulette">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="wheel" width="600" height="600"></canvas>
          <button id="spinBtn" class="spin-btn">SPIN</button>
        </div>
        <div id="result" class="result"></div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
